<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent CoE Front Door golden path</title>
  <desc id="desc">A logo-free visual summary of the Agent CoE Front Door process from employee need through answer, self-build, intake, and triage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FBFF"/>
      <stop offset="0.55" stop-color="#F4F0FF"/>
      <stop offset="1" stop-color="#EEFDF7"/>
    </linearGradient>
    <linearGradient id="hero" x1="80" y1="64" x2="1120" y2="564" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <circle cx="1110" cy="74" r="120" fill="#DBEAFE" opacity="0.65"/>
  <circle cx="96" cy="548" r="150" fill="#CCFBF1" opacity="0.55"/>
  <circle cx="1030" cy="542" r="86" fill="#EDE9FE" opacity="0.75"/>

  <rect x="54" y="44" width="1092" height="542" rx="32" fill="white" opacity="0.78" filter="url(#shadow)"/>
  <rect x="80" y="64" width="1040" height="96" rx="26" fill="url(#hero)"/>
  <text x="112" y="112" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Agent CoE Front Door</text>
  <text x="112" y="140" fill="#E0F2FE" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">Answer first. Intake second. Governed routing only when needed.</text>

  <g filter="url(#softShadow)">
    <rect x="98" y="214" width="176" height="118" rx="22" fill="#FFFFFF"/>
    <rect x="118" y="234" width="50" height="50" rx="16" fill="#DBEAFE"/>
    <path d="M143 247a14 14 0 1 1 0 28a14 14 0 0 1 0-28Z" fill="#2563EB"/>
    <path d="M128 298c8-12 22-18 35-10c6 4 11 9 15 16" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>
    <text x="118" y="304" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Employee need</text>
    <text x="118" y="326" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13">Describe the problem</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="330" y="214" width="188" height="118" rx="22" fill="#FFFFFF"/>
    <rect x="350" y="234" width="50" height="50" rx="16" fill="#E0E7FF"/>
    <path d="M364 252h22M364 264h22M364 276h15" stroke="#4F46E5" stroke-width="6" stroke-linecap="round"/>
    <circle cx="393" cy="276" r="8" fill="#4F46E5"/>
    <text x="350" y="304" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Check first</text>
    <text x="350" y="326" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13">Catalogue and guidance</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="574" y="202" width="180" height="142" rx="24" fill="#FFFFFF"/>
    <path d="M664 224L728 273L664 322L600 273Z" fill="#F3E8FF" stroke="#7C3AED" stroke-width="4"/>
    <text x="628" y="279" fill="#6D28D9" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">Resolve?</text>
    <text x="604" y="324" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13">Choose the lightest path</text>
  </g>

  <path d="M274 273H321" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M518 273H566" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="830" y="194" width="236" height="72" rx="20" fill="#EFF6FF"/>
    <circle cx="862" cy="230" r="16" fill="#2563EB"/>
    <path d="M855 230l5 5l11-13" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="890" y="226" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Reuse or answer</text>
    <text x="890" y="248" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13">No request needed</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="830" y="292" width="236" height="72" rx="20" fill="#F5F3FF"/>
    <circle cx="862" cy="328" r="16" fill="#7C3AED"/>
    <path d="M854 329h16M862 321v16" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <text x="890" y="324" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Guide self-build</text>
    <text x="890" y="346" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13">Approved path and visibility</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="830" y="390" width="236" height="72" rx="20" fill="#ECFDF5"/>
    <circle cx="862" cy="426" r="16" fill="#0F766E"/>
    <path d="M856 420h12v12h-12zM871 423h5M871 431h5" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="890" y="422" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Confirm intake</text>
    <text x="890" y="444" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13">Write only after approval</text>
  </g>

  <path d="M754 254C788 230 797 230 822 230" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M754 273H822" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M754 292C790 426 800 426 822 426" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="394" y="424" width="390" height="88" rx="24" fill="#0F172A"/>
    <text x="426" y="460" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">CoE triage app</text>
    <text x="426" y="486" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="14">Review requests, manage status, and track portfolio visibility.</text>
  </g>

  <path d="M830 426C780 492 768 468 792 468" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="98" y="504" width="230" height="38" rx="19" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="122" y="529" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Logo-free release visual</text>
  <text x="904" y="532" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="13">Reusable template guidance for adopters</text>
</svg>
